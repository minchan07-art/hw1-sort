<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <rect width="720" height="300" fill="#fbfbf9"/>
  <text x="20" y="28" font-size="14" fill="#24292f" text-anchor="start" font-weight="600">Insert 5, 3, 8, 1, 4, 7, 9 (random order)</text>
  <text x="20" y="46" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">height 3, in-order walk: 1 3 4 5 7 8 9</text>
  <line x1="190" y1="90" x2="110" y2="155" stroke="#6e7781" stroke-width="1.6"/>
