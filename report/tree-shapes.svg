  <circle cx="462" cy="105" r="15" fill="#E69F00"/>
  <text x="462" y="109.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
  <circle cx="504" cy="135" r="15" fill="#E69F00"/>
  <text x="504" y="139.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
