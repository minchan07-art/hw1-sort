  <circle cx="190" cy="90" r="15" fill="#009E73"/>
  <text x="190" y="94.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">5</text>
  <circle cx="110" cy="155" r="15" fill="#009E73"/>
  <text x="110" y="159.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
  <circle cx="270" cy="155" r="15" fill="#009E73"/>
  <text x="270" y="159.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">8</text>
  <circle cx="70" cy="220" r="15" fill="#009E73"/>
  <text x="70" y="224.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
  <circle cx="150" cy="220" r="15" fill="#009E73"/>
  <text x="150" y="224.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
  <circle cx="230" cy="220" r="15" fill="#009E73"/>
  <text x="230" y="224.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">7</text>
  <circle cx="310" cy="220" r="15" fill="#009E73"/>
  <text x="310" y="224.5" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">9</text>
  <text x="190" y="280" font-size="12" fill="#6e7781" text-anchor="middle" font-weight="400">about n log n compares</text>
  <text x="390" y="28" font-size="14" fill="#24292f" text-anchor="start" font-weight="600">Insert 1, 3, 4, 5, 7, 8, 9 (already sorted)</text>
  <text x="390" y="46" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">height 7 = n: the tree is a linked list</text>
  <line x1="420" y1="75" x2="462" y2="105" stroke="#6e7781" stroke-width="1.6"/>
  <line x1="462" y1="105" x2="504" y2="135" stroke="#6e7781" stroke-width="1.6"/>
  <line x1="504" y1="135" x2="546" y2="165" stroke="#6e7781" stroke-width="1.6"/>
  <line x1="546" y1="165" x2="588" y2="195" stroke="#6e7781" stroke-width="1.6"/>
  <line x1="588" y1="195" x2="630" y2="225" stroke="#6e7781" stroke-width="1.6"/>
  <line x1="630" y1="225" x2="672" y2="255" stroke="#6e7781" stroke-width="1.6"/>
